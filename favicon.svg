<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    rect { fill: #ffffff; }
    .i { fill: #111111; stroke: #111111; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #0a0a0a; }
      .i { fill: #eceae4; stroke: #eceae4; }
    }
  </style>
  <rect width="64" height="64" rx="14" />
  <!--Pétalas-->
  <g class="i" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="17" />
    <line x1="32" y1="47" x2="32" y2="56" />
    <line x1="8" y1="32" x2="17" y2="32" />
    <line x1="47" y1="32" x2="56" y2="32" />
    <line x1="15" y1="15" x2="21.5" y2="21.5" />
    <line x1="49" y1="49" x2="42.5" y2="42.5" />
    <line x1="49" y1="15" x2="42.5" y2="21.5" />
    <line x1="15" y1="49" x2="21.5" y2="42.5" />
  </g>
  <!--Miolo-->
  <circle class="i" cx="32" cy="32" r="8" stroke-width="2" />
</svg>
